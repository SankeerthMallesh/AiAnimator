<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loomy blocky world test</title>
<script type="importmap">
{"imports": {
  "three": "../../../vendor/three/three.module.min.js",
  "three/addons/": "../../../vendor/three/addons/"
}}
</script>
<style>body { margin: 0; background: #111; } canvas { width: 360px; height: 640px; display: block; }</style>
</head>
<body>
<canvas id="view" width="1080" height="1920"></canvas>
<script type="module">
// Test page for explainer/js/z3d/blocky.js. window.shot(n, t) draws test shot n at time t.
import * as THREE from 'three';
import { createEngine } from '../../../explainer/js/z3d/engine.js';
import { Avatar, LOOKS, makeWorld } from '../../../explainer/js/z3d/blocky.js';
const view = document.getElementById('view'), g = view.getContext('2d');
const engine = createEngine({ width: 1080, height: 1920 });
const cam = (pos, look, fov = 36) => { const c = new THREE.PerspectiveCamera(fov, 9 / 16, 0.05, 400); c.position.set(...pos); c.lookAt(...look); return c; };
const SHOTS = [
  // 0: the cast in town, wide
  ({ makeStage }) => {
    const scene = makeStage({ shadowSize: 12, sun: 2.8, sunDir: [-6, 10, 8] }); scene.add(makeWorld('town'));
    const av = LOOKS.map((l, i) => { const a = new Avatar(l); a.object.position.set((i - 2.5) * 0.85, 0, 0.6 - Math.abs(i - 2.5) * 0.2); a.object.rotation.y = -(i - 2.5) * 0.08; scene.add(a.object); return a; });
    return { scene, camera: cam([0, 1.5, 9.5], [0, 0.95, 0]), update: (t) => { av.forEach((a, i) => a.pose(['wave', 'stand', 'cheer', 'point', 'stand', 'shrug'][i], t + i)); return { bloom: 0.15 }; } };
  },
  // 1: talking close-up
  ({ makeStage }) => {
    const scene = makeStage({ shadowSize: 8, sun: 2.8, sunDir: [-6, 10, 8] }); scene.add(makeWorld('town'));
    const a = new Avatar(LOOKS[0]); scene.add(a.object);
    return { scene, camera: cam([0.45, 1.45, 2.4], [0, 1.25, 0], 34), update: (t) => { a.pose('talk', t, { talking: true }); return { bloom: 0.15 }; } };
  },
  // 2: reactions
  ({ makeStage }) => {
    const scene = makeStage({ shadowSize: 8, sun: 2.8, sunDir: [-6, 10, 8] }); scene.add(makeWorld('park'));
    const pose = ['surprised', 'cheer', 'scared'];
    const av = [LOOKS[2], LOOKS[3], LOOKS[1]].map((l, i) => { const a = new Avatar(l); a.object.position.set((i - 1) * 1.05, 0, -Math.abs(i - 1) * 0.3); a.object.rotation.y = -(i - 1) * 0.25; scene.add(a.object); return a; });
    return { scene, camera: cam([0.2, 1.25, 5.6], [0, 0.9, 0]), update: (t) => { av.forEach((a, i) => a.pose(pose[i], t)); return { bloom: 0.15 }; } };
  },
  // 3: walking in the snow, low tracking shot
  ({ makeStage }) => {
    const scene = makeStage({ shadowSize: 10, sun: 2.6, sunDir: [-6, 10, 8] }); scene.add(makeWorld('snow', 11));
    const a = new Avatar(LOOKS[4]), b = new Avatar(LOOKS[5]); scene.add(a.object, b.object);
    a.object.position.set(-0.55, 0, 0); b.object.position.set(0.55, 0, 0.2);
    return { scene, camera: cam([2.3, 1.2, 5.2], [0, 0.95, -0.4], 38), update: (t) => { a.pose('walk', t); b.pose('walk', t + 0.4, { talking: true }); return { bloom: 0.15 }; } };
  },
];
window.shot = async (n, t = 0.5) => {
  engine.setEdit({ shots: [{ start: 0, end: 10, build: SHOTS[n] }] });
  const t0 = performance.now();
  engine.renderAt(t);
  g.drawImage(engine.canvas, 0, 0, 1080, 1920);
  return Math.round(performance.now() - t0);
};
// A short silent clip: the four test shots, 1.5 s each, through Loomy's film renderer.
window.clip = async (each = 1.5) => {
  const { renderFilm } = await import('../../../explainer/js/z3d/film.js');
  const shots = SHOTS.map((build, i) => ({ start: i * each, end: (i + 1) * each, build }));
  const total = SHOTS.length * each, sr = 48000;
  const audio = new AudioBuffer({ numberOfChannels: 2, length: Math.ceil(total * sr), sampleRate: sr });
  const blob = await renderFilm({ edit: { shots }, duration: total, audio });
  return URL.createObjectURL(blob);
};
window.ready = true;
</script>
</body>
</html>
