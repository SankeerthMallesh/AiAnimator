<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loomy</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loomy">
<meta name="theme-color" content="#000000">
<meta name="description" content="Loomy 1.0: make cartoon, 3D and blocky videos from a prompt, shorts or long form, with hooks, narration, music and captions. Free, in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233D8BFF'/%3E%3Ccircle cx='16' cy='11' r='4.5' fill='%23fff'/%3E%3Cpath d='M16 15.5v7M11 18.5h10M16 22.5l-3.5 5M16 22.5l3.5 5' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bar: #000000; --ink: #EDEDED; --muted: #A1A1A1; --line: #1C1C1C; --pill: transparent; --pill-line: #2A2A2A; --on-bg: #FAFAFA; --on-ink: #0A0A0A; --bg: #000000; --accent: #FAFAFA; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 "Inter", ui-sans-serif, -apple-system, "Segoe UI", sans-serif; overflow: hidden; color-scheme: dark; }
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 5; height: calc(56px + env(safe-area-inset-top, 0px));
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  padding: env(safe-area-inset-top, 0px) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
  background: rgba(0, 0, 0, .78); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, rgba(139, 92, 246, .55), rgba(34, 211, 238, .45), transparent); pointer-events: none; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 20px; letter-spacing: -.03em; white-space: nowrap; min-width: 0; }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand small { font: 500 13.5px "Inter", sans-serif; color: var(--muted); letter-spacing: 0; padding-left: 12px; margin-left: 2px; border-left: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; }
.brand small.ver { border: 0; margin-left: 0; padding: 3px 8px; border-radius: 999px; font: 700 11.5px/1 "Inter", sans-serif; color: #fff; background: linear-gradient(120deg, #8B5CF6, #3B82F6 55%, #22D3EE); }
.tab[aria-selected="true"] { box-shadow: 0 6px 22px -10px rgba(99, 102, 241, .8); }
.tabs { display: flex; gap: 8px; }
.tab { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--pill-line); background: var(--pill); color: var(--ink); font: 500 14px/1 "Inter", sans-serif;
  padding: 9px 16px; border-radius: 999px; cursor: pointer; min-height: 44px; transition: background .15s, border-color .15s, color .15s; }
.tab svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tab { color: #D4D4D4; }
.tab:hover { border-color: #4A4A4A; background: rgba(255,255,255,.05); color: #fff; }
.tab[aria-selected="true"] { background: var(--on-bg); color: var(--on-ink); border-color: var(--on-bg); }
.tab:focus-visible, .share:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
 .right { display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
.account { position: relative; display: flex; align-items: center; }
.account[hidden] { display: none; }
.gsi-slot { min-height: 40px; display: flex; align-items: center; color-scheme: light; }
.acct-btn { border: 1px solid var(--pill-line); background: var(--pill); color: var(--ink); font: 500 14px "Inter", sans-serif; padding: 9px 14px; border-radius: 999px; cursor: pointer; }
.avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #333; background: #E07A2E; color: #fff; font: 700 15px "Inter", sans-serif; cursor: pointer; padding: 0; overflow: hidden; display: grid; place-items: center; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.acct-menu { position: absolute; top: 48px; right: 0; z-index: 20; width: 260px; background: #1B1B1B; border: 1px solid #333; border-radius: 12px; box-shadow: 0 14px 40px rgba(0,0,0,.5); padding: 6px; display: grid; }
.acct-menu[hidden] { display: none; }
.acct-menu .who { display: grid; gap: 2px; padding: 10px 10px 6px; }
.acct-menu .who b { font-weight: 600; }
.acct-menu .who span { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
.acct-menu .status { margin: 0 10px 6px; font-size: 12px; color: #57C785; }
.acct-menu button { text-align: left; border: 0; background: none; color: var(--ink); font: 500 13.5px "Inter", sans-serif; padding: 9px 10px; border-radius: 7px; cursor: pointer; }
.acct-menu button:hover { background: #262626; }
.acct-menu .danger { color: #FF6B61; }
.share { display: inline-flex; align-items: center; gap: 7px; border: 0; background: var(--on-bg); color: var(--on-ink); font: 500 14px/1 "Inter", sans-serif; padding: 10px 16px; border-radius: 8px; cursor: pointer; min-height: 38px; }
.share svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.share:hover { background: #E2E2E2; }
.views { position: fixed; left: 0; right: 0; bottom: 0; top: calc(56px + env(safe-area-inset-top, 0px)); }
/* Hidden sections stay alive (so a video keeps rendering) but sit behind the active one. */
.views iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); opacity: 0; pointer-events: none; z-index: 0; }
.views iframe.on { opacity: 1; pointer-events: auto; z-index: 1; }
.views iframe { transition: opacity .18s ease; }
@media (prefers-reduced-motion: reduce) { .views iframe { transition: none; } }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 9; background: #FAFAFA; color: #0A0A0A; border: 1px solid #FAFAFA; padding: 10px 14px; border-radius: 9px; }
.toast[hidden] { display: none; }
@media (max-width: 860px) { .brand small:not(.ver) { display: none; } .share span { display: none; } .tab { padding: 9px 12px; } }
@media (max-width: 560px) {
  .top { grid-template-columns: auto 1fr auto; gap: 8px; }
  .brand span { display: none; }
  .tabs { gap: 4px; justify-content: center; }
  .tab { gap: 5px; padding: 8px 10px; font-size: 13px; min-height: 38px; }
  /* Phones: every tab keeps its name (no icons); the row scrolls sideways if it has to. */
  .tabs { overflow-x: auto; scrollbar-width: none; min-width: 0; justify-content: flex-start; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab svg { display: none; }
  .tab { flex: none; min-height: 44px; }
  .brand svg { width: 26px; height: 26px; }
  .share { padding: 10px; }
  .account:not([hidden]) + .share { display: none; }
}
@media (max-width: 370px) { .tabs { gap: 4px; } .tab { padding: 8px 10px; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#lg)"/><circle cx="16" cy="11" r="4.5" fill="#fff"/><path d="M16 15.5v7M11 18.5h10M16 22.5l-3.5 5M16 22.5l3.5 5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
    <span>Loomy</span><small class="ver" title="Loomy 1.0: hooks in the first seconds, 3D objects, long-form videos">1.0</small>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-cartoon" data-view="cartoon" aria-controls="view-cartoon"><svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><path d="M12 9v7M8 12h8M12 16l-3 5M12 16l3 5"/></svg><span>Cartoons</span></button>
    <button class="tab" role="tab" id="tab-3d" data-view="3d" aria-controls="view-3d"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"/></svg><span>3D</span></button>
    <button class="tab" role="tab" id="tab-blocky" data-view="blocky" aria-controls="view-blocky"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="8" rx="1"/><rect x="6" y="11.5" width="12" height="6" rx="1"/><path d="M8.5 17.5v4M15.5 17.5v4"/></svg><span>Blocky</span></button>
    <button class="tab" role="tab" id="tab-clips" data-view="clips" aria-controls="view-clips"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="11" height="18" rx="2"/><path d="M17 9l4-2v10l-4-2"/></svg><span>Clips</span></button>
    <button class="tab" role="tab" id="tab-edit" data-view="edit" aria-controls="view-edit"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.6 7.5L20 18M8.6 16.5L20 6"/></svg><span>Edit</span></button>
    <button class="tab" role="tab" id="tab-board" data-view="board" aria-controls="view-board"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.6"/><circle cx="16" cy="14" r="1.6"/><path d="M8 9l8 5"/></svg><span>Board</span></button>
  </nav>
  <div class="right"><div class="account" id="account" hidden></div><button class="share" id="shareBtn" title="Copy the Loomy link"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 5.5a3 3 0 0 1 0 5.6M18.5 19a5.5 5.5 0 0 0-3-4.9"/></svg><span>Share</span></button></div>
</header>
<main class="views" id="views"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="account.js?v=202611220348"></script>
<script>
(() => {
  const SECTIONS = {
    cartoon: { src: 'cartoon/', title: 'Loomy · Cartoons' },
    '3d':    { src: 'explainer/', title: 'Loomy · 3D' },
    blocky:  { src: 'explainer/?style=blocky', title: 'Loomy · Blocky' },
    clips:   { src: 'clip/', title: 'Loomy · Clips' },
    edit:    { src: 'editor/', title: 'Loomy · Edit' },
    board:   { src: 'board/', title: 'Loomy · Board' },
  };
  const views = document.getElementById('views');
  const frames = {};

  // A section loads the first time it is opened, then stays open in the background.
  function frame(name, extra = '') {
    if (frames[name]) return { el: frames[name], fresh: false };
    const f = document.createElement('iframe');
    f.id = 'view-' + name;
    f.title = SECTIONS[name].title;
    f.setAttribute('role', 'tabpanel');
    f.setAttribute('aria-labelledby', 'tab-' + name);
    f.allow = 'clipboard-read; clipboard-write; autoplay; fullscreen';
    f.src = SECTIONS[name].src + extra;
    views.append(f);
    frames[name] = f;
    return { el: f, fresh: true };
  }
  function show(name, extra = '', updateHash = true) {
    if (!SECTIONS[name]) name = 'cartoon';
    const { el } = frame(name, extra);
    for (const [k, f] of Object.entries(frames)) f.classList.toggle('on', k === name);
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === name)));
    document.title = SECTIONS[name].title;
    if (updateHash) history.replaceState(null, '', location.pathname + (name === 'cartoon' ? '' : '#' + name));
    try { el.contentWindow?.focus(); } catch { /* not loaded yet */ }
    return el;
  }

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => show(t.dataset.view)));
  document.querySelector('.tabs').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const tabs = [...document.querySelectorAll('.tab')];
    const i = tabs.indexOf(document.activeElement); if (i < 0) return;
    const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    next.focus(); show(next.dataset.view);
  });

  document.getElementById('shareBtn').addEventListener('click', async () => {
    const url = location.origin + location.pathname;
    const t = document.getElementById('toast');
    try { await navigator.clipboard.writeText(url); t.textContent = 'Loomy link copied. Send it to anyone.'; }
    catch { t.textContent = url; }
    t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 3000);
  });

  // The Board sends a note to a video section.
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin || e.data?.loomy !== 'open' || typeof e.data.topic !== 'string') return;
    const name = e.data.tool === '3d' ? '3d' : 'cartoon';
    const had = !!frames[name];
    const f = show(name, '?topic=' + encodeURIComponent(e.data.topic));
    if (had) f.contentWindow.postMessage({ loomy: 'topic', topic: e.data.topic }, location.origin);
  });

  function boot() {
    // Starting point: #3d, #board, #board:b=<shared board>, or ?topic= for the cartoon section.
    const h = location.hash.slice(1);
    const topic = new URLSearchParams(location.search).get('topic');
    if (h.startsWith('board:')) {
      show('board', '#' + h.slice(6), false);
      history.replaceState(null, '', location.pathname + '#board');
    } else if (SECTIONS[h] && h !== 'cartoon') {
      show(h, topic ? '?topic=' + encodeURIComponent(topic) : '', false);
    } else {
      show('cartoon', topic ? '?topic=' + encodeURIComponent(topic) : '', false);
      if (topic) history.replaceState(null, '', location.pathname);
    }
  }
  (window.LoomyAccount?.ready || Promise.resolve()).catch(() => {}).then(boot);
  addEventListener('hashchange', () => {
    const h = location.hash.slice(1);
    if (h.startsWith('board:')) { boot(); return; }
    show(SECTIONS[h] ? h : 'cartoon', '', false);
  });
})();
</script>
</body>
</html>
