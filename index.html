<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loomy</title>
<meta name="description" content="Loomy: make cartoon shorts and 3D explainer shorts from a prompt, and plan ideas on a board. Free, in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2337352F'/%3E%3Ccircle cx='16' cy='11' r='4.5' fill='%23fff'/%3E%3Cpath d='M16 15.5v7M11 18.5h10M16 22.5l-3.5 5M16 22.5l3.5 5' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root { --bar: #FFFFFF; --ink: #37352F; --muted: #787774; --line: #E9E9E7; --hover: rgba(55,53,47,.06); --on: rgba(55,53,47,.09); --bg: #FFFFFF; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bar: #191919; --ink: #E3E2DF; --muted: #9B9A97; --line: #2F2F2F; --hover: rgba(255,255,255,.06); --on: rgba(255,255,255,.1); --bg: #191919; }
}
:root[data-theme="dark"] { --bar: #191919; --ink: #E3E2DF; --muted: #9B9A97; --line: #2F2F2F; --hover: rgba(255,255,255,.06); --on: rgba(255,255,255,.1); --bg: #191919; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 "Inter", ui-sans-serif, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 5; height: calc(48px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 14px;
  padding: env(safe-area-inset-top, 0px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  background: var(--bar); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 24px; height: 24px; flex: none; }
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--hover); }
.tab { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; color: var(--muted); font: 500 14px/1 inherit; font-family: inherit;
  padding: 8px 14px; border-radius: 7px; cursor: pointer; min-height: 36px; }
.tab svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--bar); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
.tab:focus-visible { outline: 2px solid #2383E2; outline-offset: 1px; }
.views { position: fixed; left: 0; right: 0; bottom: 0; top: calc(48px + env(safe-area-inset-top, 0px)); }
/* Hidden sections stay alive (so a video keeps rendering) but sit behind the active one. */
.views iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); opacity: 0; pointer-events: none; z-index: 0; }
.views iframe.on { opacity: 1; pointer-events: auto; z-index: 1; }
@media (max-width: 560px) {
  .top { gap: 8px; justify-content: space-between; }
  .brand span { display: none; }
  .tabs { flex: 1; max-width: 340px; }
  .tab { flex: 1; justify-content: center; padding: 8px 6px; min-height: 40px; }
}
@media (pointer: coarse) { .tab { min-height: 42px; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><circle cx="16" cy="11" r="4.5" fill="var(--bar)"/><path d="M16 15.5v7M11 18.5h10M16 22.5l-3.5 5M16 22.5l3.5 5" stroke="var(--bar)" stroke-width="2.2" stroke-linecap="round"/></svg>
    <span>Loomy</span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-cartoon" data-view="cartoon" aria-controls="view-cartoon"><svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="3"/><path d="M12 9v7M8 12h8M12 16l-3 5M12 16l3 5"/></svg><span>Cartoons</span></button>
    <button class="tab" role="tab" id="tab-3d" data-view="3d" aria-controls="view-3d"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"/></svg><span>3D</span></button>
    <button class="tab" role="tab" id="tab-board" data-view="board" aria-controls="view-board"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.6"/><circle cx="16" cy="14" r="1.6"/><path d="M8 9l8 5"/></svg><span>Board</span></button>
  </nav>
</header>
<main class="views" id="views"></main>
<script>
(() => {
  const SECTIONS = {
    cartoon: { src: 'cartoon/', title: 'Loomy · Cartoons' },
    '3d':    { src: 'explainer/', title: 'Loomy · 3D' },
    board:   { src: 'board/', title: 'Loomy · Board' },
  };
  const views = document.getElementById('views');
  const frames = {};

  // A section loads the first time it is opened, then stays open in the background.
  function frame(name, extra = '') {
    if (frames[name]) return { el: frames[name], fresh: false };
    const f = document.createElement('iframe');
    f.id = 'view-' + name;
    f.title = SECTIONS[name].title;
    f.setAttribute('role', 'tabpanel');
    f.setAttribute('aria-labelledby', 'tab-' + name);
    f.allow = 'clipboard-read; clipboard-write; autoplay; fullscreen';
    f.src = SECTIONS[name].src + extra;
    views.append(f);
    frames[name] = f;
    return { el: f, fresh: true };
  }
  function show(name, extra = '', updateHash = true) {
    if (!SECTIONS[name]) name = 'cartoon';
    const { el } = frame(name, extra);
    for (const [k, f] of Object.entries(frames)) f.classList.toggle('on', k === name);
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.view === name)));
    document.title = SECTIONS[name].title;
    if (updateHash) history.replaceState(null, '', location.pathname + (name === 'cartoon' ? '' : '#' + name));
    try { el.contentWindow?.focus(); } catch { /* not loaded yet */ }
    return el;
  }

  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => show(t.dataset.view)));
  document.querySelector('.tabs').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const tabs = [...document.querySelectorAll('.tab')];
    const i = tabs.indexOf(document.activeElement); if (i < 0) return;
    const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    next.focus(); show(next.dataset.view);
  });

  // The Board sends a note to a video section.
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin || e.data?.loomy !== 'open' || typeof e.data.topic !== 'string') return;
    const name = e.data.tool === '3d' ? '3d' : 'cartoon';
    const had = !!frames[name];
    const f = show(name, '?topic=' + encodeURIComponent(e.data.topic));
    if (had) f.contentWindow.postMessage({ loomy: 'topic', topic: e.data.topic }, location.origin);
  });

  // Starting point: #3d, #board, #board:b=<shared board>, or ?topic= for the cartoon section.
  const h = location.hash.slice(1);
  const topic = new URLSearchParams(location.search).get('topic');
  if (h.startsWith('board:')) {
    show('board', '#' + h.slice(6), false);
    history.replaceState(null, '', location.pathname + '#board');
  } else if (h === '3d' || h === 'board') {
    show(h, topic ? '?topic=' + encodeURIComponent(topic) : '', false);
  } else {
    show('cartoon', topic ? '?topic=' + encodeURIComponent(topic) : '', false);
    if (topic) history.replaceState(null, '', location.pathname);
  }
})();
</script>
</body>
</html>
