<html lang="en">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loomy Board</title>
<meta name="description" content="A detective-style planning board: pin ideas, tie them together with yarn, and send any note to the video tools.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF5A6B'/%3E%3Cstop offset='1' stop-color='%23D90F2B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='11' r='4.5' fill='%23fff'/%3E%3Cpath d='M16 15.5v7M11 18.5h10M16 22.5l-3.5 5M16 22.5l3.5 5' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/board.css?v=202611221919">
<link rel="stylesheet" href="../theme.css?v=202611221919">
</head>
<body>
<header class="bar">
  <div class="bar-left">
    <a class="home" href="../" title="Back to the video tools">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span>Tools</span>
    </a>
    <input id="boardName" class="board-name" value="Idea board" aria-label="Board name" spellcheck="false">
  </div>
  <div class="bar-tools" role="toolbar" aria-label="Board tools">
    <button class="tb" id="addNote" title="Add a note (N)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Note</span></button>
    <div class="swatches" id="swatches" role="radiogroup" aria-label="Note colour"></div>
    <button class="tb" id="fitBtn" title="Show everything"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Fit</span></button>
    <button class="tb" id="shareBtn" title="Copy a link to this board"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>Share</span></button>
    <button class="tb" id="moreBtn" aria-expanded="false" title="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
    <div class="menu" id="menu" hidden>
      <button id="exportBtn">Save board as a file</button>
      <button id="importBtn">Open a board file…</button>
      <button id="newBoardBtn">Start a new board</button>
      <button id="clearBtn" class="danger">Clear this board</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</header>

<main class="stage" id="stage" aria-label="Board">
  <div class="world" id="world">
    <svg class="yarn" id="yarn" aria-hidden="true"></svg>
    <div class="cards" id="cards"></div>
  </div>
  <div class="hint" id="hint">
    <p><b>Double-click</b> the board (or press <b>Note</b>) to pin an idea.</p>
    <p>Drag from a note's <b>red pin</b> to another note to tie them with yarn.</p>
    <p>Drag empty board to move around. Scroll or pinch to zoom.</p>
  </div>
  <div class="zoom" aria-label="Zoom">
    <button id="zoomOut" aria-label="Zoom out">−</button>
    <span id="zoomVal">100%</span>
    <button id="zoomIn" aria-label="Zoom in">+</button>
  </div>
</main>

<div class="toast" id="toast" role="status" hidden></div>
